name: Congestion Controller Improvement Pilot
on:
  push:
    branches:
      - feature/validation-sandbox-explainability
    paths:
      - '.github/workflows/congestion-controller-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-controller-pilot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install SUMO and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import sumo
          with open('/tmp/sumo_home', 'w') as f: f.write(sumo.SUMO_HOME)
          PY
          echo "SUMO_HOME=$(cat /tmp/sumo_home)" >> "$GITHUB_ENV"
          echo "$(cat /tmp/sumo_home)/bin" >> "$GITHUB_PATH"
      - name: Verify tests and simulator
        run: |
          sumo --version
          python -m pytest tests/test_spillback_aware.py tests/test_controllers.py -q
      - name: Validate proposed three-controller matrix
        run: |
          python -m teamb.experiments run --name congestion_pilot_heavy --scenarios road_closure --controllers fixed_time,max_pressure,max_pressure_spillback --seeds 1-3 --workers 2 --scenario-params '{"demand_scale":1.25}' --dry-run | tail -1 | grep -x "9 runs"
      - name: Heavy-demand road-closure pilot (9 runs)
        run: |
          python -m teamb.experiments run --name congestion_pilot_heavy --scenarios road_closure --controllers fixed_time,max_pressure,max_pressure_spillback --seeds 1-3 --workers 2 --scenario-params '{"demand_scale":1.25}' --strict-validation
      - name: Normal rush-hour regression pilot (6 runs)
        run: |
          python -m teamb.experiments run --name congestion_pilot_nominal --scenarios rush_hour --controllers max_pressure,max_pressure_spillback --seeds 1-3 --workers 2 --strict-validation
      - name: Show comparison reports
        run: |
          cat results/experiments/congestion_pilot_heavy/report.md
          cat results/experiments/congestion_pilot_nominal/report.md
      - name: Upload pilot data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: congestion-controller-pilot-${{ github.run_id }}
          path: |
            results/experiments/congestion_pilot_heavy/
            results/experiments/congestion_pilot_nominal/
          if-no-files-found: warn
          retention-days: 14
