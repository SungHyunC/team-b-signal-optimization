name: Robustness and Sensitivity Testing
on:
  push:
    branches:
      - feature/validation-sandbox-explainability
    paths:
      - '.github/workflows/robustness-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[run-robustness-pilot]') || contains(github.event.head_commit.message, '[run-full-sensitivity]'))) }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install SUMO and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import sumo
          with open('/tmp/sumo_home', 'w') as f: f.write(sumo.SUMO_HOME)
          PY
          echo "SUMO_HOME=$(cat /tmp/sumo_home)" >> "$GITHUB_ENV"
          echo "$(cat /tmp/sumo_home)/bin" >> "$GITHUB_PATH"
      - name: Check simulator and demand-scale overrides
        run: |
          sumo --version
          python - <<'PY'
          from teamb.scenarios import get_scenario
          for scenario in ('rush_hour', 'emergency', 'road_closure'):
              for scale in (0.75, 1.25):
                  base = get_scenario(scenario)
                  modified = get_scenario(scenario, demand_scale=scale)
                  assert len(base.flows) == len(modified.flows)
                  assert modified.defaults.get('demand_scale') == scale
                  print(f'{scenario}: scale {scale} validated')
          PY
      - name: Pilot at 75 percent demand (six paired-controller runs)
        run: |
          python -m teamb.experiments run --name robustness_pilot_low --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1 --workers 2 --scenario-params '{"demand_scale":0.75}' --strict-validation
      - name: Pilot at 125 percent demand (six paired-controller runs)
        run: |
          python -m teamb.experiments run --name robustness_pilot_high --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1 --workers 2 --scenario-params '{"demand_scale":1.25}' --strict-validation
      - name: Full paired-seed matrix at 75 percent demand (180 runs)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-full-sensitivity]') }}
        run: |
          python -m teamb.experiments run --name robustness_low --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1-30 --workers 2 --scenario-params '{"demand_scale":0.75}' --strict-validation
      - name: Full paired-seed matrix at 125 percent demand (180 runs)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-full-sensitivity]') }}
        run: |
          python -m teamb.experiments run --name robustness_high --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1-30 --workers 2 --scenario-params '{"demand_scale":1.25}' --strict-validation
      - name: Upload sensitivity results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robustness-results-${{ github.run_id }}
          path: |
            results/experiments/robustness_pilot_low/
            results/experiments/robustness_pilot_high/
            results/experiments/robustness_low/
            results/experiments/robustness_high/
          if-no-files-found: warn
          retention-days: 14
