name: CI
# Every pull request and every push to main: install, doctor, the full test suite, JavaScript
# checks, one strict-valid SUMO run, and the production Docker image with SUMO inside it.
# (Replaces the old per-branch cloud-live-sumo.yml and sandbox-readiness.yml workflows.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
jobs:
  test:
    name: Tests, JavaScript and SUMO smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install teamb with test tools and libsumo (exact versions from requirements.lock)
        run: python -m pip install -e ".[dev,fast]" -c requirements.lock
      - name: teamb doctor
        run: teamb doctor --skip-sim
      - name: Full test suite
        run: pytest
      - name: JavaScript syntax (every tracked .js and .mjs file)
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: JavaScript unit tests
        if: hashFiles('tests/js/**') != ''
        run: node --test tests/js/
      - name: Sandbox road-closure preset in real SUMO (strict validation)
        run: |
          teamb exp run --name sandbox_smoke --scenarios road_closure --controllers max_pressure --seeds 33 --workers 1 --end 1200 --scenario-params '{"demand_scale":1.25}' --strict-validation
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('results/experiments/sandbox_smoke')
          audit = json.loads((d / 'validation.json').read_text())
          assert audit['complete'] and audit['valid_runs'] == 1, audit
          summary = json.loads(next((d / 'runs').glob('*/summary.json')).read_text())
          assert summary['controller_errors'] == 0
          assert summary['fallback_steps'] == 0
          assert summary['rejected_actions'] == 0
          print('SANDBOX SMOKE PASS: complete and safe', summary['mean_delay_s'])
          PY
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-smoke-${{ github.run_id }}
          path: results/experiments/sandbox_smoke/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Production Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (runs teamb doctor, including a SUMO smoke run, as the app user)
        run: docker build -t team-b-live-sumo:ci .
      - name: Image runs as non-root and ships no test tooling
        run: |
          uid="$(docker run --rm --entrypoint id team-b-live-sumo:ci -u)"
          echo "container uid: $uid"
          test "$uid" != "0"
          docker run --rm --entrypoint python team-b-live-sumo:ci -c "import importlib.util as u, sys; found = [m for m in ('pytest', 'httpx') if u.find_spec(m)]; print('test tools in image:', found); sys.exit(1 if found else 0)"
      - name: Launch the FastAPI service, check health, access gate and SUMO + TraCI inside it
        run: |
          docker run -d --rm --name live-sumo-ci -p 10000:10000 -e TWIN_ACCESS_TOKEN=ci-secret-value team-b-live-sumo:ci
          python3 - <<'PY'
          import time, urllib.error, urllib.request
          for i in range(90):
              try:
                  with urllib.request.urlopen('http://localhost:10000/healthz', timeout=3) as resp:
                      assert resp.status == 200
                      print('Docker healthcheck passed')
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('Docker live twin failed to start')
          try:
              urllib.request.urlopen('http://localhost:10000/api/state')
              raise SystemExit('Unauthenticated API should be blocked')
          except urllib.error.HTTPError as exc:
              assert exc.code == 401
          print('Docker access gate passed')
          PY
          # Render once failed only at runtime because the pip-provided SUMO binary could not
          # load libXrender.so.1 (PR #10). Start and step SUMO inside the running container,
          # as the non-root user, writing to the default results/ folder.
          docker exec -i live-sumo-ci python - <<'PY'
          from teamb.sim.env import SimEnv
          sim = SimEnv("rush_hour", "fixed_time", seed=1, end_time=60)
          try:
              sim.start()
              sim.step()
              print("Docker SUMO + TraCI connection passed", sim.t, flush=True)
          finally:
              sim.close()
          PY
      - name: Container logs
        if: always()
        run: |
          docker logs live-sumo-ci --tail 40 || true
          docker stop live-sumo-ci || true
