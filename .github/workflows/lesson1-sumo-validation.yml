name: Statistical Validation and Reproducibility
# Research study (manual only): the 180-run paired-seed baseline, fixed_time vs max_pressure on
# rush_hour, emergency and road_closure, seeds 1-30. The original run (41929708299) is archived
# in docs/results/studies/baseline-180/. Unit tests run in ci.yml, not here.
on:
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: 'Run all 180 SUMO experiments (otherwise matrix check and smoke test only)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install teamb and SUMO (exact versions from requirements.lock)
        run: python -m pip install -e . -c requirements.lock
      - name: Verify installed simulation engine
        run: teamb doctor --skip-sim
      - name: Validate matrix construction (180 expected)
        run: |
          python -m teamb.experiments run --name lesson1_validation --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1-30 --workers 2 --dry-run > /tmp/matrix.txt
          tail -1 /tmp/matrix.txt
          test "$(tail -1 /tmp/matrix.txt)" = "180 runs"
      - name: SUMO smoke test (two controllers, same seed)
        run: |
          python -m teamb.experiments run --name lesson1_smoke --scenarios rush_hour --controllers fixed_time,max_pressure --seeds 1 --workers 1 --strict-validation
      - name: Full 180-run paired-seed matrix
        if: ${{ inputs.run_full_matrix }}
        run: |
          python -m teamb.experiments run --name lesson1_validation --scenarios rush_hour,emergency,road_closure --controllers fixed_time,max_pressure --seeds 1-30 --workers 2 --strict-validation
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson1-sumo-results-${{ github.run_id }}
          path: |
            results/experiments/lesson1_smoke/
            results/experiments/lesson1_validation/
          if-no-files-found: warn
          retention-days: 90
