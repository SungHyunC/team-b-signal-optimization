name: Congestion Failure Analysis
# Research analysis (manual only): read-only diagnosis of the two 180-run matrices of a
# "Robustness and Sensitivity Testing" run made with run_full_matrix. Pass that run's id; its
# artifact must not have expired. The original diagnosis (run 41958378469 of robustness run
# 41946810451) is archived in docs/results/studies/congestion-diagnosis/.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a completed full robustness run (artifact robustness-results-<run_id>)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download the robustness experiment
        uses: actions/download-artifact@v8
        with:
          name: robustness-results-${{ inputs.run_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: results/experiments
      - name: Compare high-demand controller metrics and bottlenecks
        # teamb.experiments.diagnose needs only the standard library, so no install step
        run: |
          python -m teamb.experiments.diagnose results/experiments/robustness_high --output results/diagnostics/high_demand.json > /tmp/high_demand.txt
          python -m teamb.experiments.diagnose results/experiments/robustness_low --output results/diagnostics/light_demand.json > /tmp/light_demand.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('high_demand', 'light_demand'):
              result = json.loads((Path('results/diagnostics') / (name + '.json')).read_text())
              assert result['run_count'] == 180, (name, result['run_count'])
              for scenario, details in result['scenarios'].items():
                  assert details['paired_seeds'] == 30, (name, scenario, details['paired_seeds'])
                  print(name, scenario, 'warnings:', details['warnings'])
                  for metric in ('mean_delay_s', 'mean_delay_incl_unfinished_s', 'unfinished_pct',
                                 'completed', 'throughput_veh_h', 'queue_p95_veh',
                                 'spillback_duration_s', 'ev_mean_travel_time_s'):
                      m = details['metrics'][metric]
                      print(' ', metric, 'fixed:', m['baseline_mean'], 'max-pressure:', m['candidate_mean'],
                            'paired difference:', m['candidate_minus_baseline'])
                  print('hotspots:', details['spillback_hotspots'])
          PY
      - name: Upload concise diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: congestion-diagnosis-${{ github.run_id }}
          path: results/diagnostics/
          if-no-files-found: warn
          retention-days: 90
